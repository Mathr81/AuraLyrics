name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform'
        type: choice
        options: [ios, android, both]
        default: ios
      configuration:
        description: 'Configuration (iOS) / Variant (Android)'
        type: choice
        options: [Debug, Release]
        default: Debug

# ─────────────────────────────────────────────────────────────────────────────
# iOS
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build_ios:
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-15  # Force l'utilisation de macOS 15 (Sequoia)

    steps:
      - name: ⬇️ • Checkout
        uses: actions/checkout@v4

      - name: 🛠️ • Set Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'  # Sélectionne spécifiquement Xcode 16.4 stable

      - name: 📀 • Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 💾 • Cache node_modules
        uses: actions/cache@v4
        with:
          path: mobile/node_modules
          key: node-ios-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: node-ios-

      - name: 🗂️ • Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: mobile

      - name: 🔨 • Expo Prebuild (iOS)
        run: npx expo prebuild -p ios --clean --no-install
        working-directory: mobile
        env:
          CI: '1'

      - name: 🔧 • Patch Podfile — fix ExpoModulesJSI xcframework in CI
        working-directory: mobile/ios
        run: |
          ruby - << 'RUBY'
          content = File.read('Podfile')
          ci_patch = %q(
            # CI: disable code-signing & sandboxing for all pods (fixes ExpoModulesJSI xcframework)
            installer.pods_project.targets.each do |t|
              t.build_configurations.each do |c|
                c.build_settings['CODE_SIGNING_ALLOWED']            = 'NO'
                c.build_settings['CODE_SIGNING_REQUIRED']           = 'NO'
                c.build_settings['CODE_SIGN_IDENTITY']              = ''
                c.build_settings['ENABLE_USER_SCRIPT_SANDBOXING']   = 'NO'
              end
            end
          )
          if content.include?('post_install do |installer|')
            content.sub!('post_install do |installer|', "post_install do |installer|\n#{ci_patch}")
          else
            content += "\npost_install do |installer|\n#{ci_patch}\nend\n"
          end
          File.write('Podfile', content)
          puts "✅ Podfile patched"
          RUBY

      - name: 💾 • Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            mobile/ios/Pods
            ~/.cocoapods
          key: pods-ios-${{ hashFiles('mobile/ios/Podfile') }}
          restore-keys: pods-ios-

      - name: 🍫 • Pod install
        run: pod install
        working-directory: mobile/ios

      - name: 🔨 • Pre-build ExpoModulesJSI xcframework
        # ExpoModulesJSI is a local pod installed via :path => node_modules/expo-modules-jsi/apple.
        # CocoaPods does NOT copy source into Pods/ExpoModulesJSI/ — PODS_TARGET_SRCROOT
        # points directly into node_modules. The build-xcframework.sh script shells out to a
        # nested `xcodebuild` (via `env -i`) which fails inside Xcode's sandboxed script phase.
        # Running it here — before the main build, with full env access — pre-builds the
        # xcframework and records its source hash. Xcode's build phase then finds an up-to-date
        # hash and skips, making the ExpoModulesJSI phase a no-op.
        working-directory: mobile
        run: |
          EXPO_JSI_SCRIPT="node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh"
          if [ ! -f "$EXPO_JSI_SCRIPT" ]; then
            echo "⚠️  expo-modules-jsi not in node_modules — skipping pre-build"
            exit 0
          fi
          # Resolve absolute paths with symlink expansion (cd && pwd) so the source hash
          # recorded here matches what Xcode's build phase computes from PODS_ROOT / REACT_NATIVE_PATH.
          export PODS_ROOT="$(cd "ios/Pods" && pwd)"
          export PLATFORM_NAME="iphoneos"
          export REACT_NATIVE_PATH="$(cd "node_modules/react-native" && pwd)"
          echo "→ PODS_ROOT         : $PODS_ROOT"
          echo "→ PLATFORM_NAME     : $PLATFORM_NAME"
          echo "→ REACT_NATIVE_PATH : $REACT_NATIVE_PATH"
          echo "→ Pre-building ExpoModulesJSI xcframework…"
          bash "$EXPO_JSI_SCRIPT"
          echo "✅ ExpoModulesJSI xcframework ready"

      - name: 💎 • Install xcpretty
        run: gem install xcpretty --no-document

      - name: 🏗️ • Build iOS (unsigned)
        working-directory: mobile/ios
        env:
          CODE_SIGNING_ALLOWED: 'NO'
          CODE_SIGNING_REQUIRED: 'NO'
          CODE_SIGN_IDENTITY: ''
          ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
        run: |
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1 | xargs basename)
          SCHEME="${WORKSPACE%.xcworkspace}"
          CONFIG="${{ github.event.inputs.configuration }}"
          echo "→ Workspace     : $WORKSPACE"
          echo "→ Scheme        : $SCHEME"
          echo "→ Configuration : $CONFIG"

          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
          | xcpretty --color

      - name: 📦 • Bundle IPA
        working-directory: mobile/ios
        run: |
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1 | xargs basename)
          APP_NAME="${WORKSPACE%.xcworkspace}"
          CONFIG="${{ github.event.inputs.configuration }}"
          APP_PATH="build/Build/Products/${CONFIG}-iphoneos/${APP_NAME}.app"

          echo "→ Packaging $APP_NAME.app → $APP_NAME.ipa"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "${APP_NAME}.ipa" Payload
          mv "${APP_NAME}.ipa" "build/${APP_NAME}.ipa"
          rm -rf Payload
          echo "✅ IPA: mobile/ios/build/${APP_NAME}.ipa"

      - name: 🌍 • Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AuraLyrics-iOS-${{ github.event.inputs.configuration }}-IPA
          path: mobile/ios/build/*.ipa
          if-no-files-found: error
          retention-days: 30
          
# ─────────────────────────────────────────────────────────────────────────────
# Android
# ─────────────────────────────────────────────────────────────────────────────
  build_android:
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ • Checkout
        uses: actions/checkout@v4

      - name: 📀 • Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ • Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 💾 • Cache node_modules
        uses: actions/cache@v4
        with:
          path: mobile/node_modules
          key: node-android-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: node-android-

      - name: 🗂️ • Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: mobile

      - name: 🔨 • Expo Prebuild (Android)
        run: npx expo prebuild -p android --clean --no-install
        working-directory: mobile
        env:
          CI: '1'

      - name: 💾 • Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: 🤖 • Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: mobile/android

      - name: 🏗️ • Build Android APK
        working-directory: mobile/android
        run: |
          CONFIG="${{ github.event.inputs.configuration }}"
          if [ "$CONFIG" = "Release" ]; then
            ./gradlew assembleRelease --no-daemon
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> $GITHUB_ENV
            echo "APK_NAME=AuraLyrics-release.apk" >> $GITHUB_ENV
          else
            ./gradlew assembleDebug --no-daemon
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV
            echo "APK_NAME=AuraLyrics-debug.apk" >> $GITHUB_ENV
          fi

      - name: 📦 • Rename APK
        run: cp "mobile/android/${{ env.APK_PATH }}" "${{ env.APK_NAME }}"

      - name: 🌍 • Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraLyrics-Android-${{ github.event.inputs.configuration }}-APK
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30
